{% extends "user_dashboard.html" %}
{% block user_content %}
<div class="neon-section">
    <h2 class="neon-title">League Profiles</h2>
    
    <div class="neon-league-list">
        {% for league in leagues %}
            <div class="neon-league-item">
                <div class="league-content">
                    <div class="league-info">
                        {% if league[3] %}
                            <img src="{{ league[3] }}" alt="{{ league[1] }} Logo" class="league-logo">
                        {% endif %}
                        {% if league[2] %}
                            <img src="{{ league[2] }}" alt="{{ league[1] }} Flag" class="flag-img">
                        {% endif %}
                        <a href="{{ url_for('user.profile_league', league_id=league[0]) }}" class="league-name">{{ league[1] }}</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

<style>
:root {
    --primary-dark: #1a1b2e;
    --secondary-dark: #242538;
    --accent-blue: #4361ee;
    --neon-blue: #00f3ff;
    --neon-purple: #bc13fe;
    --neon-red: #ff0055;
    --neon-green: #00ff9d;
    --neon-yellow: #ffdd00;
    --text-light: #ffffff;
    --text-gray: #8b8c9f;
}

/* Section styling */
.neon-section {
    padding: 0;
    background-color: transparent;
    border-radius: 8px;
    margin-top: 0;
    width: 100%;
}

/* Title styling */
.neon-title {
    color: var(--neon-blue);
    text-shadow: 0 0 5px var(--neon-blue), 0 0 10px var(--neon-blue);
    margin-bottom: 1rem;
    font-size: 1.8rem;
    position: relative;
    display: inline-block;
}

.neon-title::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -3px;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-red));
    border-radius: 2px;
    box-shadow: 0 0 8px var(--neon-blue);
}

/* League list styling */
.neon-league-list {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    width: 100%;
}

.neon-league-item {
    background-color: var(--secondary-dark);
    border: 2px solid var(--neon-blue);
    border-radius: 8px;
    overflow: hidden;
    transition: all 0.3s ease;
    position: relative;
    width: 100%;
    box-shadow: 0 0 8px var(--neon-blue), inset 0 0 2px var(--neon-blue);
}

.neon-league-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
}

.league-content {
    display: flex;
    align-items: center;
    padding: 1rem 1.5rem;
    justify-content: flex-start;
    width: 100%;
}

.league-info {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.league-logo {
    height: 45px;
    width: auto;
    filter: drop-shadow(0 0 3px rgba(0, 243, 255, 0.8));
}

.flag-img {
    width: 30px;
    height: 20px;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
}

.league-name {
    color: var(--text-light);
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
    font-size: 1.2rem;
}

.league-name:hover {
    color: var(--neon-blue);
    text-shadow: 0 0 5px var(--neon-blue);
    text-decoration: none;
}

/* Color alternating effect for leagues */
.neon-league-item:nth-child(3n+1) {
    border-color: var(--neon-blue);
    box-shadow: 0 0 8px var(--neon-blue), inset 0 0 2px var(--neon-blue);
}

.neon-league-item:nth-child(3n+2) {
    border-color: var(--neon-purple);
    box-shadow: 0 0 8px var(--neon-purple), inset 0 0 2px var(--neon-purple);
}

.neon-league-item:nth-child(3n) {
    border-color: var(--neon-red);
    box-shadow: 0 0 8px var(--neon-red), inset 0 0 2px var(--neon-red);
}

.neon-league-item:nth-child(3n+1):hover {
    box-shadow: 0 0 15px var(--neon-blue), inset 0 0 4px var(--neon-blue);
}

.neon-league-item:nth-child(3n+2):hover {
    box-shadow: 0 0 15px var(--neon-purple), inset 0 0 4px var(--neon-purple);
}

.neon-league-item:nth-child(3n):hover {
    box-shadow: 0 0 15px var(--neon-red), inset 0 0 4px var(--neon-red);
}
</style>
{% endblock %}
