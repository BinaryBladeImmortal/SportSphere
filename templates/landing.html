{% extends "layout.html" %}
{% block content %}
<div class="neon-jumbotron">
    <div class="border-animation"></div>
    <div class="content">
        <h1 class="neon-title">Welcome to the Sports League Management System</h1>
        <p class="neon-lead">Manage leagues, teams, players, and more.</p>
        <hr class="neon-divider">
        <p class="neon-text">Log in to get started or register if you don't have an account.</p>
        <div class="button-container">
            <a href="{{ url_for('login') }}" class="neon-button login-btn">Login</a>
            <a href="{{ url_for('register') }}" class="neon-button register-btn">Register</a>
        </div>
    </div>
</div>

<style>
:root {
    --neon-blue: #00f3ff;
    --neon-purple: #bc13fe;
    --primary-dark: #1a1b2e;
}

.neon-jumbotron {
    position: relative;
    background: rgba(26, 27, 46, 0.8);
    border-radius: 10px;
    padding: 2rem;
    margin: 2rem auto;
    max-width: 800px;
    text-align: center;
    overflow: hidden;
}

.border-animation {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border: 2px solid transparent;
    border-radius: 10px;
    animation: borderAnimation 8s linear infinite;
}

@keyframes borderAnimation {
    0% {
        border-color: #ff0000;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
    }
    33% {
        border-color: #00ff00;
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
    }
    66% {
        border-color: #0000ff;
        box-shadow: 0 0 15px rgba(0, 0, 255, 0.3);
    }
    100% {
        border-color: #ff0000;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
    }
}

.content {
    position: relative;
    z-index: 1;
}

.neon-title {
    color: #fff;
    font-size: 2.5rem;
    margin-bottom: 1rem;
    text-shadow: 
        0 0 3px rgba(255, 255, 255, 0.5),
        0 0 5px rgba(0, 243, 255, 0.3);
    opacity: 0.9;
}

.neon-lead {
    color: #fff;
    font-size: 1.5rem;
    margin-bottom: 1.5rem;
    text-shadow: 0 0 5px var(--neon-purple);
}

.neon-divider {
    border: 0;
    height: 2px;
    background: linear-gradient(90deg, 
        transparent, 
        var(--neon-blue),
        var(--neon-purple),
        var(--neon-blue),
        transparent
    );
    margin: 1.5rem 0;
    box-shadow: 0 0 5px var(--neon-blue);
}

.neon-text {
    color: rgba(255, 255, 255, 0.9);
    font-size: 1.1rem;
    margin-bottom: 1.5rem;
}

.button-container {
    display: flex;
    gap: 1rem;
    justify-content: center;
}

.neon-button {
    display: inline-block;
    padding: 0.8rem 2rem;
    font-size: 1.1rem;
    text-decoration: none;
    border-radius: 5px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.login-btn {
    background: transparent;
    border: 2px solid var(--neon-blue);
    color: var(--neon-blue);
}

.login-btn:hover {
    background: var(--neon-blue);
    color: var(--primary-dark);
    box-shadow: 0 0 15px var(--neon-blue);
}

.register-btn {
    background: transparent;
    border: 2px solid var(--neon-purple);
    color: var(--neon-purple);
}

.register-btn:hover {
    background: var(--neon-purple);
    color: var(--primary-dark);
    box-shadow: 0 0 15px var(--neon-purple);
}

@media (max-width: 576px) {
    .neon-jumbotron {
        margin: 1rem;
        padding: 1.5rem;
    }

    .neon-title {
        font-size: 2rem;
    }

    .button-container {
        flex-direction: column;
    }

    .neon-button {
        width: 100%;
        text-align: center;
    }
}
</style>
{% endblock %}
